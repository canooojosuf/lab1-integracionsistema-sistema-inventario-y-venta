info:
  name: Actualizar productos
  type: http
  seq: 5

http:
  method: PUT
  url: "{{host}}/productos/7"
  body:
    type: json
    data: |
      {
          "id": 7,
          "nombre": "TALADRO",
          "descripcion": "Taladro de 500W",
          "marca": "BOSCH",
          "medida": "UNIDAD",
          "precio": 50,
          "stock": 20
        }
  auth: inherit

runtime:
  variables:
    - name: host
      value: http://127.0.0.1:8000/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
