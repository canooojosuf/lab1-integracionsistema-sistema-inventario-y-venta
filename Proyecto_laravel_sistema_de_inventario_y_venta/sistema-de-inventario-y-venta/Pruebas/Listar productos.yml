info:
  name: Listar productos
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/productos"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  variables:
    - name: host
      value: http://127.0.0.1:8000/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
